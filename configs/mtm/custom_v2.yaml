# configs/mtm/custom_v2.yaml
# =========================
# MTM/config/mtm_clsf_config.py의 MTM_Custom_V2_Auto 클래스 값 이관.
# datapath/num_chn/dataset/ratios/max_len은 원본처럼 meta.json에서 런타임에
# 자동 결정된다(train_mtm.py 참고) — 여기는 데이터셋과 무관한 고정 하이퍼파라미터만.
#
# (참고: 같은 파일의 MTM_Custom_V2_W3S1은 window=3h/stride=1h 실험용 별도 static
#  config였고, 이번 augmentation 실험 매트릭스(low/high/augmented_plus_high)에는
#  쓰이지 않아 이관하지 않았다.)

seed: 2024
num_cls: 2
d_static: 4
emr: 0.0

d_model: 128
r_hid: 2
drop: 0.15
norm_first: true
down_mode: concat
weighted_sampling: true

lr: 1.0e-5
lr_factor: 0.2
weight_decay: 0.0
patience: 10
es_patience: 100
monitor: epoch/val_auroc
mon_mode: max
grad_clip_val: null
max_epochs: 100
batch_size: 16

metrics: [auprc, auroc, acc, prec, rec, f1]
