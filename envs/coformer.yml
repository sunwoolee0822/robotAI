# conda env create -f envs/coformer.yml
# train_coformer.py, src/models/coformer.py, src/analysis/{attention_viz,subgroup_cm}.py
# (CoFormer side) 실행용. 실제 검증된 conda env(`coformer`)의 핵심 패키지 버전.
name: coformer
channels:
  - dglteam
  - pytorch
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - torch==2.7.0
      - dgl==2.4.0
      - pytorch-lightning==2.6.1
      - torchmetrics==1.9.0
      - numpy==2.2.6
      - pandas==2.3.3
      - scipy==1.15.3
      - matplotlib==3.10.8
      - seaborn==0.13.2
      - pyyaml==6.0.3
      - scikit-learn==1.7.2
      - easydict
      - tqdm
      - wandb
