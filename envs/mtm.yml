# conda env create -f envs/mtm.yml
# train_mtm.py, src/models/mtm.py, src/preprocess/*, src/augment/*,
# src/analysis/{missing_rate,label_compare,subgroup_cm,attention_viz}.py (MTM side) 실행용.
# 실제 검증된 conda env(`mtm`)의 핵심 패키지 버전을 옮김 — `conda env export`
# 전체 덤프 대신, 이 저장소 코드가 실제로 import하는 것만 추림.
name: mtm
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - torch==2.10.0
      - pytorch-lightning==2.6.1
      - torchmetrics==1.8.2
      - einops==0.8.2
      - timm==1.0.24
      - numpy==2.3.5
      - pandas==2.3.3
      - scipy==1.17.0
      - matplotlib==3.10.8
      - seaborn==0.13.2
      - pyyaml==6.0.3
      - scikit-learn==1.7.2
      # lmm_partial_effect_patient.py(src/analysis/label_compare.py로 이관) 등
      # GEE/MixedLM 기반 통계 분석에 필요 — 원본 MTM/analysis/lmm_*.py가 쓰던 의존성.
      - statsmodels==0.14.6
      - tqdm
      - wandb
